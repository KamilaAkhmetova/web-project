<div class="dashboard-container">
    <div class="dashboard-header">
        <h1 style="color: rgb(244, 245, 250);">{{ todayDate | date:'EEEE, d MMMM yyyy' }}</h1>
        <!-- <div class="today-date">{{ todayDate | date:'EEEE, d MMMM yyyy' }}</div> -->
    </div>
    
    <!-- НОВЫЕ БЫСТРЫЕ ССЫЛКИ -->
    <div class="quick-links-section">
        <h2 style="color: rgb(244, 245, 250);">QUICK LINKS</h2>
        <div class="quick-links-grid">
            <a href="https://kbtu.edu.kz/ru/studentam/obshchezhitie" target="_blank" class="quick-link-card">
                <img src="/dorm.png" alt="dormitory" class="link-icon">
                <span style="font-weight: bold;">DORMITORY</span>
            </a>
            <a href="https://wsp.kbtu.kz/StudentFiles" target="_blank" class="quick-link-card">
                <img src="/files.png" alt="files" class="link-icon">
                <span style="font-weight: bold;">STUDENT FILES</span>
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.kbtu&hl=ru" target="_blank" class="quick-link-card">
                <img src="/map.png" alt="map" class="link-icon">
                <span style="font-weight: bold;">KBTU MAP</span>
            </a>
            <a href="https://t.me/KBTUNFS" target="_blank" class="quick-link-card">
                <img src="/tg.png" alt="Telegram" class="link-icon">
                <span style="font-weight: bold;">TELEGRAM</span>
            </a>
        </div>
    </div>
</div>
<div class="card news-card">
    <div class="card-header">
        <h2 style="text-align: center; color: rgb(0, 47, 108);">NEWS</h2>
    </div>
    <div class="card-content">
        
        <div class="news-list">
            @for (news of newsList; track news.id) {
                <div class="news-item" (click)="openNewsModal(news)">
                    <div class="news-content">
                        <div class="news-title">{{ news.title }}</div>
                        <div class="news-date">{{ news.formatted_date }}</div>
                        <div class="news-excerpt">{{ news.preview }}</div>
                        <div class="news-read-more">Read more →</div>
                    </div>
                </div>
            }
        </div>
        @if (showLoadMore) {
            <div class="load-more-container">
                <button (click)="loadAllNews()" class="load-more-btn">
                    Load All News
                </button>
            </div>
        }        
    </div>

</div>
@if (showModal) {
    <app-news-modal [news]="selectedNews" (closed)="closeModal()"></app-news-modal>
}
