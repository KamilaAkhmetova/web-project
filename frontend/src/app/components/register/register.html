<div class="register-container">
    <div class="register-card">
        <div class="kbtu-logo">
            <h1>KAZAKH-BRITISH<br>TECHNICAL UNIVERSITY</h1>
        </div>
        
        <h2>Регистрация</h2>
        
        <div class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>
        <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
        </div>
        
        <form (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" class="form-control" [(ngModel)]="userData.username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-control" [(ngModel)]="userData.email" name="email" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Полное имя</label>
                    <input type="text" class="form-control" [(ngModel)]="userData.full_name" name="full_name" placeholder="Имя Фамилия">
                </div>
                
                <div class="form-group">
                    <label>Группа</label>
                    <input type="text" class="form-control" [(ngModel)]="userData.practice_group" name="practice_group" placeholder="например: IT-301">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="password" class="form-control" [(ngModel)]="userData.password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label>Подтвердите пароль *</label>
                    <input type="password" class="form-control" [(ngModel)]="userData.password2" name="password2" required>
                </div>
            </div>
            
            <button type="submit" class="btn-register" [disabled]="isLoading">
                {{ isLoading ? 'Регистрация...' : 'Зарегистрироваться' }}
            </button>
        </form>
        
        <div class="login-link">
            Уже есть аккаунт? <a routerLink="/login">Войти</a>
        </div>
    </div>
</div>
